# Aggiornamento del Registro Unico Intermediari dall'export IVASS.
# Non parte mai da solo: lo avvia l'admin dalla pagina Aggiornamento di
# Ruisearch (con GITHUB_TOKEN sulla Edge Function) oppure da qui con
# "Run workflow".
#
# Serve il secret DATABASE_URL del repository: connection string del pooler
# Supabase in *session mode* (porta 5432), perche' il caricamento usa COPY e
# tiene un advisory lock per tutta la durata (in transaction mode non va).

name: Aggiorna registro IVASS

on:
  workflow_dispatch:
    inputs:
      forza:
        description: "Ricarica anche se l'export è identico all'ultimo"
        type: boolean
        default: false

concurrency:
  group: aggiorna-registro
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dipendenze (solo backend)
        run: npm install --omit=dev --no-audit --no-fund --workspaces=false

      - name: Scarica e carica il registro
        # Sotto i 40 minuti del job: se scade e' questo passo a fallire e il
        # passo finale ha ancora il tempo di chiudere la riga di import_runs.
        timeout-minutes: 35
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_POOL_MAX: "2"
          RUI_ID_CORSA_FILE: ${{ runner.temp }}/import-run-id
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Manca il secret DATABASE_URL del repository."
            exit 1
          fi
          if [ "${{ inputs.forza }}" = "true" ]; then
            node scripts/import.js --forza
          else
            node scripts/import.js
          fi

      - name: Segna l'aggiornamento come interrotto
        if: failure() || cancelled()
        timeout-minutes: 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_POOL_MAX: "1"
          RUI_ID_CORSA_FILE: ${{ runner.temp }}/import-run-id
        run: |
          if [ -z "$DATABASE_URL" ]; then exit 0; fi
          node scripts/chiudi-import-interrotto.js
